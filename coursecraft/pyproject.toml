[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coursecraft-cli"
version = "0.1.0"
description = "Manage CourseCraft course content in Airtable"
requires-python = ">=3.9"
dependencies = [
    "cli-tools-shared @ git+https://github.com/adbertram/cli-tools.git#subdirectory=cli-tools-shared",
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
coursecraft = "coursecraft_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["coursecraft_cli*"]

[tool.setuptools.package-data]
coursecraft_cli = ["voice_pronunciations.json", "voice_pronunciation_patterns.json", "voice_pronunciation_tokens.json"]
