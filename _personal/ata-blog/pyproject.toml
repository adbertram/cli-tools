[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ata-blog-cli"
version = "0.1.0"
description = "CLI for managing ATA Blog (adamtheautomator.com)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "playwright>=1.52.0",
    "playwright-stealth>=2.0.0",
    "cli-tools-shared",
]

[project.scripts]
"ata-blog" = "ata_blog_cli.main:main"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ata_blog_cli*"]

[tool.uv.sources]
cli-tools-shared = { path = "../../_repo/cli-tools-shared", editable = true }
