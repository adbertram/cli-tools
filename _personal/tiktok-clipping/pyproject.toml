[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiktok-clipping-cli"
version = "0.1.0"
description = "Durable clipping coordinator with bounded model proposals"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "cli-tools-shared",
    "tiktok-cli",
    "n8n-cli",
    "whop-cli",
    "google-cli",
    "youtube-cli",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
"tiktok-clipping" = "tiktok_clipping_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["tiktok_clipping_cli*"]

[tool.uv.sources]
cli-tools-shared = { path = "../../_repo/cli-tools-shared", editable = true }
tiktok-cli = { path = "../../tiktok", editable = true }
n8n-cli = { path = "../../n8n", editable = true }
whop-cli = { path = "../../whop", editable = true }
google-cli = { path = "../../google", editable = true }
youtube-cli = { path = "../../youtube", editable = true }
