[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pluralsight-author-cli"
version = "0.1.0"
description = "CLI interface for PluralsightAuthor (browser automation)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "cli-tools-shared",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
pluralsight-author = "pluralsight_author_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["pluralsight_author_cli*"]

[tool.uv.sources]
cli-tools-shared = { path = "../../_repo/cli-tools-shared", editable = true }
