[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "progress-servicenow-cli"
version = "0.1.0"
description = "CLI interface for Progress ServiceNow Employee Center (browser automation)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "cli-tools-shared",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
progress-servicenow = "progress_servicenow_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["progress_servicenow_cli*"]

[tool.setuptools.package-data]
progress_servicenow_cli = [
    "_bytecode_cache/*.pyc",
    "commands/_bytecode_cache/*.pyc",
    "models/_bytecode_cache/*.pyc",
    "ticket_template.json",
]

[tool.uv.sources]
cli-tools-shared = { path = "../../_repo/cli-tools-shared", editable = true }
