[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiktok-cli"
version = "0.1.0"
description = "TikTok transcript downloader using yt-dlp"
requires-python = ">=3.9"
dependencies = [
    "cli-tools-shared @ git+https://github.com/adbertram/cli-tools.git#subdirectory=cli-tools-shared",
    "typer[all]>=0.9.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
tiktok = "tiktok_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["tiktok_cli*"]
