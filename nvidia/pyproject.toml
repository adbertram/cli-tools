[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nvidia-cli"
version = "0.1.0"
description = "CLI interface for Nvidia (browser automation)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "cli-tools-shared",
]

[project.scripts]
nvidia = "nvidia_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["nvidia_cli*"]

[tool.uv.sources]
cli-tools-shared = { path = "../cli-tools-shared", editable = true }
