[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-sessions-cli"
version = "0.1.0"
description = "Query and analyze DeepSeek Harness (dsh) session transcripts from ~/.dsh"
# 3.14 is required: dsh writes session logs as concatenated Zstandard frames and
# `compression.zstd` (stdlib, 3.14+) decodes them with no third-party dependency.
requires-python = ">=3.14"
dependencies = [
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "cli-tools-shared",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
"deepseek-sessions" = "deepseek_sessions_cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["deepseek_sessions_cli*"]

[tool.uv.sources]
cli-tools-shared = { path = "../_repo/cli-tools-shared", editable = true }
