[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "n8n-node-cli"
version = "0.1.0"
description = "Convert standardized CLI tools into n8n community node packages"
requires-python = ">=3.11"
dependencies = [
    "cli-tools-shared @ git+https://github.com/adbertram/cli-tools.git#subdirectory=cli-tools-shared",
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
]

[project.scripts]
n8n-node = "n8n_node_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["n8n_node_cli*"]
