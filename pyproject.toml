[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scrunch-cli"
version = "0.1.0"
description = "CLI interface for Scrunch API"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "cli-tools-common @ git+https://github.com/adbertram/cli-tools-common.git",
]

[project.scripts]
scrunch = "scrunch_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["scrunch_cli*"]
