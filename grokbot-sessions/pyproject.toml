[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grokbot-sessions-cli"
version = "0.1.0"
description = "Query Grok Bot (Grokbot) session transcripts over the live Cursor-hosted Connect RPC API"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    # Electron safeStorage (v10) blobs are AES-128-CBC; the standard library has
    # no AES, so decrypting the adopted Grok Bot session needs this.
    "cryptography>=41.0.0",
    "cli-tools-shared",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
"grokbot-sessions" = "grokbot_sessions_cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["grokbot_sessions_cli*"]

[tool.uv.sources]
cli-tools-shared = { path = "../_repo/cli-tools-shared", editable = true }
