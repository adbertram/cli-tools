[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "martinic-audio-cli"
version = "0.1.0"
description = "CLI interface for MartinicAudio (browser automation)"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "cli-tools-shared @ git+https://github.com/adbertram/cli-tools.git#subdirectory=cli-tools-shared",
]

[project.scripts]
martinic-audio = "martinic_audio_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["martinic_audio_cli*"]
