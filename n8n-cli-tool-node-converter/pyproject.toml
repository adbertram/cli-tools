[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "n8n-cli-tool-node-converter-cli"
version = "0.1.0"
description = "CLI interface for N8nCliToolNodeConverter API"
requires-python = ">=3.9"
dependencies = [
    "cli-tools-shared @ git+https://github.com/adbertram/cli-tools.git#subdirectory=cli-tools-shared",
    "typer[all]>=0.9.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
]

[project.scripts]
n8n-cli-tool-node-converter = "n8n_cli_tool_node_converter_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["n8n_cli_tool_node_converter_cli*"]
