[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-connect-slack-manager-cli"
version = "0.1.0"
description = "Manage the always-on Cody Slack cc-connect bridge"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "cli-tools-shared",
]

[project.scripts]
cc-connect-slack-manager = "cc_connect_slack_manager_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["cc_connect_slack_manager_cli*"]

[tool.uv.sources]
cli-tools-shared = { path = "../cli-tools-shared", editable = true }
