[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-cli"
version = "0.1.0"
description = "CLI interface for Kalshi API"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "httpx>=0.27.0",
    "orjson>=3.10.0",
    "websockets>=15.0",
    "cryptography>=43.0.0",
    "cli-tools-shared",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
"kalshi" = "kalshi_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["kalshi_cli*"]

[tool.setuptools.package-data]
kalshi_cli = ["presets.json"]

[tool.uv.sources]
cli-tools-shared = { path = "../_repo/cli-tools-shared", editable = true }
