[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "progress-servicenow-cli"
version = "0.1.0"
description = "CLI interface for ProgressServicenow (browser automation)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "cli-tools-shared",
]

[project.scripts]
progress-servicenow = "progress_servicenow_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["progress_servicenow_cli*"]

[tool.setuptools.package-data]
"progress_servicenow_cli" = ["ticket_template.json"]

[tool.uv.sources]
cli-tools-shared = { path = "../cli-tools-shared", editable = true }
