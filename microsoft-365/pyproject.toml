[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microsoft-365-cli"
version = "0.1.0"
description = "CLI interface for Microsoft365 (browser automation)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "cli-tools-shared @ git+https://github.com/adbertram/cli-tools.git#subdirectory=cli-tools-shared",
]

[project.scripts]
microsoft-365 = "microsoft_365_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["microsoft_365_cli*"]
