[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dropbox-cli"
version = "0.1.0"
description = "CLI interface for Dropbox API"
requires-python = ">=3.9"
dependencies = [
    "typer[all]>=0.9.0",
    "python-dotenv>=1.0.0",
    "dropbox>=12.0.0",
    "cli-tools-shared @ git+https://github.com/adbertram/cli-tools.git#subdirectory=cli-tools-shared",
]

[project.scripts]
dropbox = "dropbox_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["dropbox_cli*"]
