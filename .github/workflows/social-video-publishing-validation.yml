name: social-video-publishing-validation

on:
  push:
    branches:
      - feat/social-video-publishing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feat/social-video-publishing

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8

      - name: Install, test, and refresh usage maps
        shell: bash
        run: |
          set -euo pipefail
          for tool in facebook tiktok youtube; do
            echo "=== $tool: install ==="
            ./_repo/_scripts/install-cli-tool.sh "$tool"

            echo "=== $tool: unit tests ==="
            (
              cd "$tool"
              uv run pytest -q
            )

            echo "=== $tool: refresh usage ==="
            ./_repo/skills/cli-tool/scripts/regenerate-usage-json "$tool"
          done

      - name: Commit generated metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             facebook/uv.lock             tiktok/uv.lock             youtube/uv.lock             _repo/skills/facebook-cli/usage.json             _repo/skills/tiktok-cli/usage.json             _repo/skills/youtube-cli/usage.json
          if git diff --cached --quiet; then
            echo "No generated metadata changes."
            exit 0
          fi
          git commit -m "chore: refresh social video CLI metadata"
          git push origin HEAD:feat/social-video-publishing
