name: preview-status-test

on:
  push:
    branches:
      - feat/ata-blog-preview-status

permissions:
  contents: read

jobs:
  ata-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv
      - name: Install ata-blog
        run: ./_repo/_scripts/install-cli-tool.sh _personal/ata-blog
      - name: Run static publisher tests
        working-directory: _personal/ata-blog
        run: uv run pytest -q tests/test_static_publisher.py
