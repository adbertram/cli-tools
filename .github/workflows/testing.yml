name: testing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Discover CLI tools
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.tools.outputs.tools }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build tool matrix
        id: tools
        shell: bash
        run: |
          tools="$(python3 - <<'PY'
          import json
          from pathlib import Path

          tools = sorted(
              path.parent.name
              for path in Path(".").glob("*/pyproject.toml")
          )
          if not tools:
              raise SystemExit("No CLI tools found")
          print(json.dumps(tools))
          PY
          )"

          {
            echo "tools<<JSON"
            echo "$tools"
            echo "JSON"
          } >> "$GITHUB_OUTPUT"

          python3 - <<'PY' "$tools" >> "$GITHUB_STEP_SUMMARY"
          import json
          import sys

          tools = json.loads(sys.argv[1])
          print(f"Discovered {len(tools)} CLI tools.")
          PY

  test:
    name: Test ${{ matrix.cli }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        cli: ${{ fromJson(needs.discover.outputs.tools) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8

      - name: Install CLI
        shell: bash
        run: ./_repo/skills/cli-tool/scripts/install-cli-tool.sh "${{ matrix.cli }}"

      - name: Run CLI tests
        shell: bash
        run: ./_repo/skills/cli-tool/scripts/test-cli-tool.sh --cli-name "${{ matrix.cli }}" --verbose
