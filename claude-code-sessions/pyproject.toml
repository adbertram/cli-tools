[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-code-sessions-cli"
version = "0.1.0"
description = "CLI wrapper for claude"
requires-python = ">=3.9"
dependencies = [
    "typer[all]>=0.9.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "cli-tools-shared @ git+https://github.com/adbertram/cli-tools.git#subdirectory=cli-tools-shared",
]

[project.scripts]
claude-code-sessions = "claude_code_sessions_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["claude_code_sessions_cli*"]
