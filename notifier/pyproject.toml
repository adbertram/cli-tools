[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notifier-cli"
version = "0.1.0"
description = "CLI wrapper for terminal-notifier"
requires-python = ">=3.9"
dependencies = [
    "cli-tools-shared @ git+https://github.com/adbertram/cli-tools.git#subdirectory=cli-tools-shared",
    "typer[all]>=0.9.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
notifier = "notifier_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["notifier_cli*"]
