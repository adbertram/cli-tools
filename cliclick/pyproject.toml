[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cliclick-cli"
version = "0.1.0"
description = "CLI wrapper for cliclick"
requires-python = ">=3.11"
dependencies = [
    "cli-tools-shared @ git+https://github.com/adbertram/cli-tools.git#subdirectory=cli-tools-shared",
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
cliclick = "cliclick_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["cliclick_cli*"]
