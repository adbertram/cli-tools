[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webull-cli"
version = "0.1.0"
description = "CLI interface for Webull API"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "webull-openapi-python-sdk==3.0.3",
    "cli-tools-shared",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
"webull" = "webull_cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["webull_cli*"]

[tool.uv.sources]
cli-tools-shared = { path = "../_repo/cli-tools-shared", editable = true }
