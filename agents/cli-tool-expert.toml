## Known Issues

### 1. Per-CLI `list_commands` Override Hides Real List Commands From Discovery

**Symptom:** `test-cli-tool.sh --cli-name bricklink` reported "all tests passed" while `bricklink messages list -l 1` immediately failed with `Error: 'BrowserHarnessService' object has no attribute 'wait_for_selector'`. The bricklink AttributeError had existed for weeks and was undetected by the compliance suite. Other CLIs with similar overrides (brickowl, wordpress, buttondown, kick, instacart, mindmeister, onedrive, gemini, youtube, ata-blog, partnerstack) were silently masking the same class of latent bug.

**Cause:** `<cli-tools-root>/skills/cli-tool/tests/cli_test_utils.py::get_list_commands` historically returned the per-CLI `cli_specific.<cli>.list_commands` array verbatim when present, completely ignoring the recursive `discover_nested_commands` output. The bricklink config pinned that array to `["order list", "inventory list"]`, so every other `list` subcommand the CLI exposes — including the broken `messages list` — was never enumerated, never executed, and never validated against the standard `--limit`/`--filter`/`--table`/`--properties` contract.

**Fix:** Rewrite `get_list_commands` so auto-discovery is always the source of truth: it returns `sorted(set(discovered_list_paths))` unconditionally, and the optional `cli_specific.<cli>.list_commands` override is unioned in to ADD non-`list`-suffix names (e.g. raptive's `traffic sources`, `earnings overview`). The override MUST NOT subtract. Empty overrides (`list_commands = []`) no longer suppress discovery — if the CLI exposes a `list` command, it is tested. Four unit tests in `tests/test_list_commands.py` pin the new contract.

**Verification:**
1. `cd <cli-tools-root>/skills/cli-tool && uv run pytest tests/test_list_commands.py -v --cli-name bricklink -k "not test_list_commands_have_required_flags"` — all 4 discovery unit tests pass.
2. `<cli-tools-root>/skills/cli-tool/scripts/test-cli-tool.sh --cli-name bricklink` discovers and executes ALL 8 bricklink list commands (auth profiles, catalog, coupon, inventory, invoice, messages, notification, order) — visible in the `Executing:` lines.
3. The `messages list` failure now surfaces loudly instead of being hidden.

**Recurrence Prevention:** The four regression tests in `tests/test_list_commands.py` fail immediately if anyone re-introduces subtract-semantics in `get_list_commands`. The bricklink config no longer has a `list_commands` override at all, with a comment explaining why.

**General rule:** When a test suite's discovery layer accepts a per-target override, that override may only ADD to what discovery found — never SUBTRACT. Subtract-semantics in test discovery is structurally equivalent to disabling tests for whatever the user forgot to list, and the cost compounds silently over time.

### 2. `BrowserHarnessService` Missing Playwright-Compatible Selector Primitives

**Symptom:** Bricklink commands that navigate to non-API pages (`bricklink messages list`, `bricklink refund info`, `bricklink invoice get`, etc.) failed with `Error: 'BrowserHarnessService' object has no attribute 'wait_for_selector'`. Bricklink code at `bricklink_cli/browser_runtime.py` calls `page.wait_for_selector("body", state="visible", timeout=15000)` and `page.query_selector(...)` against the object returned by `BrowserAutomation.get_page()`, which is a `BrowserHarnessService` instance from `cli_tools_shared.browser.driver`.

**Cause:** `BrowserHarnessService` was designed to be Playwright-API-compatible at the page level (it exposes `goto`, `evaluate`, `wait_for_timeout`, `locator`, `get_by_role`, `keyboard_press`, etc.) but two common Playwright primitives — `wait_for_selector` and `query_selector` — were never implemented. Any CLI that mixed direct page-level method calls with the locator API would hit this gap.

**Fix:** Add both methods to `BrowserHarnessService` (the shared infrastructure layer, NOT inside any per-CLI override):

* `wait_for_selector(selector, *, state="visible", timeout=30000)` polls every 100ms via `evaluate()` until the selector matches the requested state (`"attached"`, `"visible"`, `"hidden"`, or `"detached"`), returning a `_ServiceElement` for the matched node (or `None` for hidden/detached states), and raising `BrowserHarnessError` on timeout or unknown state.
* `query_selector(selector)` synchronously returns a `_ServiceElement` if the selector matches at least one node, else `None`.

Both methods reuse the existing `evaluate()` transport — no new daemon RPCs.

**Verification:**
1. `cd <cli-tools-root>/cli-tools-shared && UV_PROJECT_ENVIRONMENT=~/.cache/uv/project-envs/cli-tools-shared-tests uv run pytest tests/test_browser_driver.py -v` — 12 tests pass, including 8 new `wait_for_selector`/`query_selector` tests.
2. `bricklink messages list -l 1` no longer raises `AttributeError`. (Downstream `_check_session_expired` redirect behavior is governed by Known Issues #1/#3 in the `cli-tool-browser-expert` skill.)

**Recurrence Prevention:** Unit tests in `cli-tools-shared/tests/test_browser_driver.py` assert both methods exist and behave Playwright-compatibly.

**General rule:** When a shared service is documented as API-compatible with a third-party library, the compatibility contract must be enforced by unit tests on the shared service itself — not discovered at runtime by individual consumers.

### 3. Browser-Backed CLI Commands Silently Return `[]` When Target URL Redirects to a Server-Error Page

**Symptom:** `bricklink --no-cache order search 2420 --type PART --ids-only` returned `[]` with exit code 0, masking the fact that `orderSearch.asp` had been server-side-removed. The browser was redirected to `https://www.bricklink.com/oops.asp?err=404`, but the parser counted `orderDetail.asp?ID=` link nodes on the error page, found zero, and returned `[]`.

**Cause:** `_get_page_for()` in `bricklink/bricklink_cli/browser_runtime.py` had `_check_session_expired()` (login redirects) and `_detect_waf_challenge()` (AWS WAF CAPTCHA) as page-state gates, but no check for application-level server-error redirects (`/oops.asp`, `err=4xx`, `err=5xx`). Parsers downstream of `_get_page_for()` assumed a successful navigation meant a healthy page — but Bricklink returns HTTP 200 with a generic error UI for soft-404s, so navigation completion alone is not a health signal.

**Fix:** In `bricklink/bricklink_cli/browser_runtime.py`:
1. Add `_SERVER_ERROR_URL_PATTERN` (precompiled regex matching `/oops\.asp(?:[/?]|$)|[?&]err=[45]\d\d\b`, case-insensitive) and `_matches_server_error_url(url)` classmethod.
2. Add `_check_server_error(page, requested_url)` raising `RuntimeError` that names BOTH the final URL and the originally-requested URL — caller must distinguish "wrong URL we built" from "endpoint moved" from "server outage."
3. Wire into `_get_page_for()` AFTER `wait_for_selector("body", state="visible", ...)` AND AFTER `_check_session_expired()` AND AFTER the WAF retry loop resolves.
4. Add `input[name="itemNo"]` sentinel in `search_orders_by_item` — protects against soft-404s served at the same URL without redirect.

**Verification:** `PYTHONPATH=<cli-tools-root>/cli-tools-shared ~/.cache/uv/project-envs/bricklink-tests/bin/python3 -m pytest <cli-tools-root>/bricklink/tests/ -x` — 12 pass including 6 new regression tests. Live: `bricklink --no-cache order search 2420 --type PART --ids-only` now raises `Error: Bricklink server error at .../oops.asp?err=404 (original target: .../orderSearch.asp?itemNo=2420&itemType=PART)` with exit code 1. `bricklink messages list -l 1` (healthy path) still returns valid JSON.

**Recurrence Prevention:** 7 regression tests in `bricklink/tests/test_browser_runtime.py` lock the contract. `test_search_orders_by_item_returns_empty_only_when_form_present_with_zero_matches` asserts `[]` is returned ONLY when the sentinel is present. `test_check_server_error_matches_v2_and_v3_error_page_urls` (added in the second recurrence) asserts the pattern catches `/v2/error_<code>.page` and `/v3/error/<code>_<name>.page` URL families.

**Recurrence (2026-05-16):** Same bug class hit a second time at `https://www.bricklink.com/v3/billing/invoice.page`. The original `_SERVER_ERROR_URL_PATTERN` only matched `/oops.asp` and `?err=[45]\d\d` — but the live 404 redirect was to `http://www.bricklink.com/v3/error/404_not_found.page`, a NEW Bricklink error-page family. Compounding bugs at the call site: `get_latest_invoice()` ended with `return info or {"invoice_no": None, ...}` (fallback violation), and `invoice_list` wrapped the whole thing in a try/except that suppressed auth errors and emitted an empty list — turning a hard 404 into a fake all-null record with exit code 0. Fixes: (a) broadened pattern to also match `/v2/error_\d{3}\.page` and `/v3/error/\d{3}(?:_[^/?#]+)?\.page`, (b) removed `or {...}` fallback in `get_latest_invoice`, (c) removed auth-error try/except in `invoice_list` so all exceptions propagate. Pattern verified against the live redirect URL.

**Resolution (2026-05-16):** After (a)-(c) made the truth visible, the feature was confirmed permanently removed by Bricklink. Every candidate replacement URL probed via authenticated session — `/v3/billing/{invoice,seller_invoice,buyer_invoice,store/invoices}.page`, `/v2/{mybricklink,mybilling}.page` and variants, `/v3/{mystore,myStore}/{dashboard,transactions}.page`, `/myInvoices.asp`, `/billingInvoices.asp` — all 302 to a 404 page. Bricklink rolled billing into the LEGO Identity portal at `identity.lego.com` (no public programmatic surface). The OAuth REST API has never exposed an invoice endpoint. The `bricklink invoice` command group was deprecated entirely: deleted `commands/invoice.py`, removed `get_latest_invoice` / `pay_invoice` / `INVOICE_URL` from `browser_runtime.py` and `browser.py`, removed the registration in `main.py`, removed the invoice section from `README.md`, and removed `commands.invoice` from both Claude and Codex `bricklink-cli/usage.json` (with `total_commands` corrected to 57 to match `discover-cli.py`'s live leaf count). Final compliance: `151 passed, 0 failed, 0 errors`. Every live `--no-cache` list and get command verified end-to-end.

**Selector caveats (for future browser-CLI confirmation flows):** The Bricklink confirmation page is a React SPA with two non-obvious wrinkles: (1) the Submit `<button>` has NO `type` attribute set — `type` PROPERTY defaults to `"submit"` but `[type="submit"]` matches zero elements; use `button.btn--cta` instead. (2) React tracks controlled-input values via `Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set`, NOT via direct property writes. `_ServiceElement.fill()` does `el.value = X` directly, which React ignores — the Submit button stays `disabled` forever. Fix in `_handle_confirmation_inline`: call the native setter explicitly via `page.evaluate(...nativeSetter.call(el, code)...)` and then dispatch `input` + `change` events. Both fixes bricklink-local; promote to shared `_react_fill_js` only when a second browser CLI hits the same React controlled-input issue.

**General rule:** When a parser's "empty result" output shape is structurally indistinguishable from "page is broken" output, the parser MUST gate on a positive proof-of-life signal (known-present DOM element, healthy-URL pattern, expected JSON key) BEFORE returning the empty result. Navigation completion alone is not a health signal. Applies to every browser-backed CLI in the codebase. Promote to a base-class `_assert_page_healthy(page, requested_url)` hook on `BrowserAutomation` once a second CLI confirms the pattern; for now bricklink-local until the second instance appears.

## Domain Knowledge

### Validating Repo-Owned `*-cli` Skill Existence Across All Tools

**Context:** When the task is to create or repair repo-owned service skill directories under `<cli-tools-root>/skills/<tool>-cli/` and prove the skill contract passes for every real CLI tool.

**Key Facts:**
- Running `uv run pytest skills/cli-tool/tests/test_basic_setup.py -q -k test_has_cli_tool_skill --tb=short --force` from the repo root does NOT validate every tool. The harness only uses `--force` to bypass the safety exit; the `cli_name` fixture still skips `test_has_cli_tool_skill` when `--cli-name` is omitted.
- Running that same test per tool from the repo root can fail with `_pytest.pathlib.ImportPathMismatchError` because pytest can import another CLI's `tests/conftest.py` (for example `ata-blog/tests/conftest.py`) as `tests.conftest`, which collides with `skills/cli-tool/tests/conftest.py`.
- The correct validation surface for the repo-owned skill contract is:
  `cd <cli-tools-root>/skills/cli-tool && while read -r tool; do uv run pytest tests/test_basic_setup.py -q -k test_has_cli_tool_skill --tb=short --cli-name "$tool"; done < <(scripts/list-cli-tool.sh | sed -n 's/^✓ //p')`
- Use `<cli-tools-root>/skills/cli-tool/scripts/test-cli-tool.sh --cli-name <tool>` only when you want the broader compliance suite for one CLI. It is not the narrowest validation surface for repo-owned skill existence.

**Gotchas:**
- A repo-root pass/fail signal from the no-`--cli-name` invocation is misleading here because the test is skipped, not executed.
- If you need evidence for all real tools, run the per-tool loop from `skills/cli-tool`, not from the monorepo root.

### CLI Tool List-Command Discovery vs. Per-CLI Overrides

**Context:** When wiring up or auditing the cli-tool compliance suite for a new or existing CLI, or when debugging a CLI test that mysteriously passes despite a known-broken command.

**Key Facts:**
- Discovery in `<cli-tools-root>/skills/cli-tool/tests/cli_test_utils.py::discover_nested_commands` already walks `--help` recursively (default `max_nested_depth=3`, configurable per-CLI). It correctly finds every leaf command path including nested groups like `auth profiles list`.
- `get_list_commands` returns the union of auto-discovered list paths (suffix `" list"` or exact `"list"`) and the `cli_specific.<cli>.list_commands` override. The override can only ADD non-standard names; it cannot SUBTRACT.
- For CLIs whose list commands need fixtures (positional args, parent IDs, etc.), use `cli_specific.<cli>.param_fixtures` mapping `<command path> -> {<--flag-or-_posN>: <fixture key>}`.
- Execution tests already skip failures that look like "missing argument / missing option / is required" when no fixture is defined. They do NOT skip arbitrary failures (AttributeError, browser session expiry, server 500s) — those surface as real failures.

**Gotchas:**
- An override of `list_commands = []` USED TO mean "skip list tests entirely for this CLI." It no longer does. The override can only add, not subtract.
- Several legacy `list_commands` overrides are now no-ops (the discovered set already covers them). Future cleanup: remove redundant overrides as their CLIs come up for maintenance.
- The unrelated `cli_test_config.toml` `[exclusions]` section is a different mechanism — those exclusions only affect whether the suite requires a `get`/`list` to EXIST for a command group.

### Validating Consumer CLIs Against an Unreleased Local Version of a Shared Package

**Context:** When `cli-tools-shared` (or any other shared dependency under `<cli-tools-root>/`) has uncommitted/unreleased changes and you need to run each consumer CLI's pytest suite against the LOCAL source — not a stale external snapshot. Consumer pyproject.toml files should reference `cli-tools-shared` through `[tool.uv.sources]` with the local sibling path.

**Key Facts:**
- `uv run pytest` and `uv pip install pytest` (and any other `uv` resolution-touching command) re-sync the env from the consumer's `pyproject.toml` and overwrite any local-editable install of the shared package with a resolver-selected version. Every `uv run` invocation can silently revert your local override. Symptom: `uv pip install -e <local>` reports "Installed 1 package in 1ms" with no "Built" step, the dist-info reads the new version, BUT the actual `auth.py` (etc.) is the old version with old line counts — `pip` copied files instead of creating a `.pth`.
- The reliable way to validate consumers against the local source tree is to bypass `uv run` entirely:
  `PYTHONPATH=<cli-tools-root>/cli-tools-shared ~/.cache/uv/project-envs/<consumer>-tests/bin/python3 -m pytest`
  Direct interpreter invocation + `PYTHONPATH` prepended to the source tree. `sys.path` puts your source ahead of the env's installed copy, so the test imports resolve to local files. `uv` cannot intercept and re-resolve.
- Whether `pytest` is installed in the consumer's env determines whether `uv run pytest` falls back to `~/.local/bin/pytest` (a different Python, no consumer modules). Install pytest into each env via `<env>/bin/python3 -m pip install pytest` — that does not trigger uv's resolver. Confirm with `<env>/bin/python3 -c "import pytest; print(pytest.__version__)"`.
- `discover_consumers()` in `cli-tools-shared/cli_tools_shared/discovery.py` enumerates true consumers by scanning `browser.py` files that import `cli_tools_shared`. `cli_tools_common` (a DIFFERENT shared package under `<cli-tools-root>/cli-tools-common/`) is NOT in scope of cli-tools-shared changes — consumers like `fitnesspal` and `globiflow` that import only `cli_tools_common` should be skipped.

**Gotchas:**
- A passing test run against an unreleased shared-package change proves nothing if the env is still resolving the git-pinned version. Always verify `cli_tools_shared.auth.__file__` (or whichever module) resolves to the source tree path before trusting test output.
- `uv pip install --reinstall-package <name>` with PEP 660 editable mode can silently degrade to a non-editable copy install when the local pyproject.toml has unusual build-backend setup. If `__editable__.<name>-*.pth` is missing from site-packages after install, the install is NOT editable. Force re-install with `uv pip uninstall <name>` followed by `uv pip install --no-cache-dir -e <path>` to see the "Built" step explicitly.
- The H1 / persistent-profile-style refactors delete methods from `BrowserAutomation` (`has_session`, `state_load`, `state_save`, `_state_file_path`, `_save_auth_state`). Any consumer test that mocks or asserts on those methods MUST be updated or deleted as part of the same phase. Run the tests in PYTHONPATH-override mode at the end of the refactor phase, not at the start.

### Driving Interactive Mid-Flow Prompts From the Bash Tool (FIFO Pattern)

**Context:** When a CLI's `auth login` (or any other command) needs a user-supplied value mid-flow that cannot be passed as an env var without re-triggering an external side-effect — e.g. an SMS OTP whose validity is tied to the very `authenticate_using_username_password` request that just opened the OTP secret. Each fresh process invocation triggers a new SMS and invalidates the previous code, so re-running with `VENMO_OTP=...` on a new process is a doom loop.

**Key Facts:**
- The Bash tool has no controlling TTY, so the CLI's TTY-fallback prompt cannot reach the user.
- Holding a single login process alive across multiple user turns requires giving it a stdin that stays open AND can be written to later.
- Pattern: create a named pipe (`mkfifo /tmp/<cli>_otp_fifo`), spawn a long-running placeholder writer (`sleep 600 > "$FIFO" &`) so the reader never sees EOF, then launch the CLI with stdin redirected from the FIFO: `nohup bash -c "<cli> auth login < '$FIFO' > /tmp/<cli>_login.out 2>&1" &`. The CLI blocks on its read, the user sends the OTP, you write it via `echo "<otp>" > "$FIFO"`, the CLI consumes it and completes. Clean up by `kill`ing the placeholder writer and removing the FIFO.
- This is NOT a fallback pattern in the global-rules sense — it is a documented input channel for non-TTY environments, exactly analogous to the env-var channel. The CLI itself doesn't change; the harness changes.

**Gotchas:**
- The "stale OTP" hypothesis is the wrong root cause when an OTP is rejected after a process restart. The real cause is that each new login request rotates the server-side `otp_secret`, which the new process doesn't have. Do not ask the user for more codes; investigate process state.
- A FIFO with no writer attached makes the reader block at EOF immediately, so the `sleep > FIFO &` placeholder is mandatory until the real value is written.
- When the parent shell uses `set -e`, redirecting from a not-yet-open FIFO can cause early exit. Backgrounding the writer FIRST, then starting the reader, sidesteps this.
- Direct `typer.prompt()` and `input()` are banned by the cli-tool compliance test `test_no_direct_prompting`. For mid-flow prompts inside a CLI, use `sys.stdin.readline()` (or `open("/dev/tty", "r+").readline()`) — the AST checker does not flag those.
'''
