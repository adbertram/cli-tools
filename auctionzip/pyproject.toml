[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auctionzip-cli"
version = "0.1.0"
description = "CLI interface for Auctionzip (browser automation)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "cli-tools-shared",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
"auctionzip" = "auctionzip_cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["auctionzip_cli*"]

[tool.uv.sources]
cli-tools-shared = { path = "../_repo/cli-tools-shared", editable = true }
