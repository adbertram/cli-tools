[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facebook-ads-cli"
version = "0.2.0"
description = "Complete native passthrough wrapper for Meta's official Ads CLI"
requires-python = ">=3.12"
dependencies = ["meta-ads==1.2.0", "typer>=0.9.0", "cli-tools-shared"]

[dependency-groups]
dev = ["pytest>=7.0.0"]

[project.scripts]
facebook-ads = "facebook_ads_cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["facebook_ads_cli*"]

[tool.uv.sources]
cli-tools-shared = { path = "../_repo/cli-tools-shared", editable = true }
