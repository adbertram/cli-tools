[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facebook-ads-cli"
version = "0.1.0"
description = "CLI interface for FacebookAds API"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "requests>=2.31.0",
    "facebook-business==26.0.2",
    "cli-tools-shared",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
"facebook-ads" = "facebook_ads_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["facebook_ads_cli*"]

[tool.uv.sources]
cli-tools-shared = { path = "../_repo/cli-tools-shared", editable = true }
