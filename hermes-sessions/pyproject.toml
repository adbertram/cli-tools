[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-sessions-cli"
version = "0.1.0"
description = "Query and analyze Hermes Agent session state from the local Hermes home"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "cli-tools-shared",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
"hermes-sessions" = "hermes_sessions_cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hermes_sessions_cli*"]

[tool.uv.sources]
cli-tools-shared = { path = "../_repo/cli-tools-shared", editable = true }
