[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-tools-shared"
version = "0.2.0"
description = "Shared authentication, profiles, and output utilities for CLI tools (browser-harness backed)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
    "browser-harness @ git+https://github.com/browser-use/browser-harness.git@f186cd963d67653a737bfaaf43e0edbfe85ddb77",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cli_tools_shared*"]
