[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gumroad-cli"
version = "0.1.0"
description = "CLI interface for Gumroad API"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "jsonschema>=4.0",
    "cli-tools-shared",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
"gumroad" = "gumroad_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["gumroad_cli*"]

[tool.uv.sources]
cli-tools-shared = { path = "../_repo/cli-tools-shared", editable = true }

[tool.setuptools.package-data]
gumroad_cli = ["contracts.json", "engine/package.json", "engine/package-lock.json", "engine/tsconfig.json", "engine/SOURCE.json", "engine/*.md", "engine/*.ts", "engine/*.json", "engine/src/*", "engine/assets/*"]
