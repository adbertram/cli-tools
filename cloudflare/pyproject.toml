[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudflare"
version = "0.1.0"
description = "CLI interface for Cloudflare API"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "blake3>=1.0.0",
    # cloudflare_cli/commands/r2.py imports boto3/botocore at module import
    # time for the R2 S3-compatible API. main.py imports that module
    # unconditionally, so an undeclared boto3 breaks `cloudflare --help`
    # outright the next time the uv tool venv is rebuilt from this manifest.
    "boto3>=1.34.0",
    "cli-tools-shared",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
cloudflare = "cloudflare_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["cloudflare_cli*"]

[tool.uv.sources]
cli-tools-shared = { path = "../_repo/cli-tools-shared", editable = true }
