[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "namecheap-cli"
version = "0.1.0"
description = "CLI interface for Namecheap (browser automation)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "cli-tools-shared",
]

[project.scripts]
namecheap = "namecheap_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["namecheap_cli*"]

[tool.uv.sources]
cli-tools-shared = { path = "../cli-tools-shared", editable = true }
