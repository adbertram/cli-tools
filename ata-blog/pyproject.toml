[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ata-blog-cli"
version = "0.1.0"
description = "CLI wrapper for wordpress"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "cli-tools-shared",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
ata-blog = "ata_blog_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["ata_blog_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "exercises_live_browser: test opens a real browser (no warm-page stubbing)",
]

[tool.uv.sources]
cli-tools-shared = { path = "../cli-tools-shared", editable = true }
