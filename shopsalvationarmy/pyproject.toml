[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shopsalvationarmy-cli"
version = "0.1.0"
description = "CLI interface for Shop The Salvation Army auction site"
requires-python = ">=3.9"
dependencies = [
    "typer[all]>=0.9.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "cli-tools-shared @ git+https://github.com/adbertram/cli-tools.git#subdirectory=cli-tools-shared",
]

[project.scripts]
shopsalvationarmy = "shopsalvationarmy_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["shopsalvationarmy_cli*"]
